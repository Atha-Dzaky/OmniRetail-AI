server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # Proxy API calls to FastAPI backend (preserve full URI)
    location /graph {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    # Serve charts directly from the shared volume
    location /charts/ {
        alias /app/charts/;
    }

    # Serve Frontend UI
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
